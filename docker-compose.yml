version: '3.8'

services:
  mininet-ryu:
    build: .
    container_name: ryu_mininet_lab
    privileged: true # Necessário para o Mininet configurar interfaces de rede host
    network_mode: "host" # Útil para compartilhar conectividade do X11 (Wireshark) e Mininet local
    environment:
      # Ao rodar via WSL2 (Windows 11), passamos o display nativo do WSLg
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - .:/workspace # Mapeia a pasta atual
      - /tmp/.X11-unix:/tmp/.X11-unix:rw # Compartilha o socket gráfico do WSLg nativo do Windows 11
      - /lib/modules:/lib/modules:ro # Módulos do kernel necessários para o Mininet e Open vSwitch
    stdin_open: true # Mantém a execução iterativa aberta
    tty: true        # Permite uso de terminal
